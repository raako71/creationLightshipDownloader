<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Outer glow around the being -->
    <radialGradient id="aura" cx="50%" cy="48%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#a8d8ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f3460" stop-opacity="0"/>
    </radialGradient>
    <!-- Body fill gradient (bright core, fading edges) -->
    <radialGradient id="bodyGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c8e8ff"/>
      <stop offset="100%" stop-color="#7ec8ff"/>
    </radialGradient>
    <!-- Head fill -->
    <radialGradient id="headGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8d8ff"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#1a1a2e"/>

  <!-- Aura halo -->
  <circle cx="50" cy="48" r="42" fill="url(#aura)"/>

  <!-- Light rays (8 directions, alternating long/short) -->
  <g stroke="#c8e8ff" stroke-linecap="round" opacity="0.7">
    <!-- Cardinal rays (longer) -->
    <line x1="50" y1="6"  x2="50" y2="18" stroke-width="2.5"/>
    <line x1="50" y1="78" x2="50" y2="90" stroke-width="2.5"/>
    <line x1="6"  y1="48" x2="18" y2="48" stroke-width="2.5"/>
    <line x1="82" y1="48" x2="94" y2="48" stroke-width="2.5"/>
    <!-- Diagonal rays (shorter) -->
    <line x1="20" y1="20" x2="28" y2="28" stroke-width="1.8" opacity="0.55"/>
    <line x1="72" y1="20" x2="64" y2="28" stroke-width="1.8" opacity="0.55"/>
    <line x1="20" y1="76" x2="28" y2="68" stroke-width="1.8" opacity="0.55"/>
    <line x1="80" y1="76" x2="72" y2="68" stroke-width="1.8" opacity="0.55"/>
  </g>

  <!-- Body (tapered torso) -->
  <ellipse cx="50" cy="65" rx="11" ry="14" fill="url(#bodyGlow)"/>

  <!-- Arms (outstretched slightly downward) -->
  <line x1="39" y1="60" x2="27" y2="67" stroke="url(#bodyGlow)" stroke-width="5" stroke-linecap="round"/>
  <line x1="61" y1="60" x2="73" y2="67" stroke="url(#bodyGlow)" stroke-width="5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="50" cy="43" r="10" fill="url(#headGlow)"/>

  <!-- Crown glow (small star-burst above head) -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="1.5" opacity="0.9">
    <line x1="50" y1="29" x2="50" y2="24"/>
    <line x1="55.5" y1="31" x2="58.5" y2="27"/>
    <line x1="44.5" y1="31" x2="41.5" y2="27"/>
  </g>
</svg>
